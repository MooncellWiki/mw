; 三站通用的 FPM 设置，镜像里装在 php-fpm.d/zz-mooncell.conf。
; 进程数、监听地址、状态页、[thumb] / [upload] 池这些跟部署相关的在 docker-config 的 k8s/overlays/<站>/php-fpm.conf，
; 挂在 php-fpm.d/zzz-docker.conf，按文件名排在这个文件后面加载，同名设置以各站为准。
[global]
; Possible Values: alert, error, warning, notice, debug
log_level = warning
; 官方 docker.conf 的 8192 会把较长的 JSON/异常栈切成多行，导致 Loki 无法按 JSON 解析。
log_limit = 65536

[www]
access.log = /dev/null

; LocalSettings.php 的 $wgRequestTimeLimit（25 秒）和 $wgMaxShellWallClockTime（20 秒）是按这里的 30 秒定的，
; 要让 MediaWiki 先于 FPM 超时，自己清理临时文件；改这里时那两项要一起看。
; 这个计时从 FPM 接受连接开始，包括读请求体的时间，所以大请求（上传）在 docker-config 里转到超时更长的 [upload] 池。
request_terminate_timeout = 30
