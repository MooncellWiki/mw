name: deploy

on:
  push:
    tags: ["v*.*.*-*"]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract PHP Docker Metadata
        id: php_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/mooncellwiki/php
          tags: |
            type=raw,value=latest
            type=semver,pattern={{raw}}
            type=sha

      - name: Build and push PHP image
        id: php_build
        uses: docker/build-push-action@v6
        with:
          context: ./docker/php
          push: true
          tags: ${{ steps.php_meta.outputs.tags }}
          labels: ${{ steps.php_meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/mooncellwiki/php:buildcache
          cache-to: type=registry,ref=ghcr.io/mooncellwiki/php:buildcache,mode=max

      - name: Extract mw Docker Metadata
        id: mw_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/mooncellwiki/mw
          tags: |
            type=semver,pattern={{raw}}
            type=sha

      - name: Build and push MediaWiki image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/workflows/mw.Dockerfile
          push: true
          tags: ${{ steps.mw_meta.outputs.tags }}
          labels: ${{ steps.mw_meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/mooncellwiki/mw:buildcache
          cache-to: type=registry,ref=ghcr.io/mooncellwiki/mw:buildcache,mode=max
          build-args: PHP_IMAGE=ghcr.io/mooncellwiki/php@${{ steps.php_build.outputs.digest }}

      - name: Extract Caddy Docker Metadata
        id: caddy_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/mooncellwiki/caddy
          tags: |
            type=semver,pattern={{raw}}
            type=sha

      - name: Build and push Caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/workflows/caddy.Dockerfile
          push: true
          tags: ${{ steps.caddy_meta.outputs.tags }}
          labels: ${{ steps.caddy_meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/mooncellwiki/caddy:buildcache
          cache-to: type=registry,ref=ghcr.io/mooncellwiki/caddy:buildcache,mode=max
          build-args: VERSION=${{ github.ref_name }}
