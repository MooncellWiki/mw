name: deploy

on:
  push:
    tags: ["v*.*.*-*"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # gerrit.wikimedia.org 对匿名 HTTP clone 返回 403（2026-10 起），VisualEditor 的嵌套子模块 lib/ve
      # 指向那里，checkout 会在这一步挂掉。改从 GitHub 镜像拉同一个 commit；actions/checkout 的子模块
      # 更新用的是运行器上的 git，这条全局 insteadOf 对它生效。
      - name: Clone gerrit submodules from the GitHub mirror
        run: git config --global url."https://github.com/wikimedia/VisualEditor.git".insteadOf "https://gerrit.wikimedia.org/r/VisualEditor/VisualEditor.git"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract mw Docker Metadata
        id: mw_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/mooncellwiki/mw
          tags: |
            type=semver,pattern={{raw}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/workflows/mw.Dockerfile
          push: true
          tags: ${{ steps.mw_meta.outputs.tags }}
          labels: ${{ steps.mw_meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/mooncellwiki/mw:buildcache
          cache-to: type=registry,ref=ghcr.io/mooncellwiki/mw:buildcache,mode=max

      - name: Extract Caddy Docker Metadata
        id: caddy_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/mooncellwiki/caddy
          tags: |
            type=semver,pattern={{raw}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/workflows/caddy.Dockerfile
          push: true
          tags: ${{ steps.caddy_meta.outputs.tags }}
          labels: ${{ steps.caddy_meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/mooncellwiki/caddy:buildcache
          cache-to: type=registry,ref=ghcr.io/mooncellwiki/caddy:buildcache,mode=max
          build-args: VERSION=${{ github.ref_name }}
